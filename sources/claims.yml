  label: Secondhand
  source: https://www.theregister.com/2024/05/29/internal_google_search_documents/
  also: https://ipullrank.com/google-algo-leak
  locator: Article body
  checked: 2026-11-18

- id: c01-006
  chapter: 01
  claim: Google confirmed the leaked documents were authentic and cautioned against inaccurate assumptions based on out-of-context, outdated or incomplete information.
