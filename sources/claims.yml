- id: c02-001
  chapter: 02
  claim: Google Search is fully automated and most pages in its results are found by crawlers rather than submitted manually.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Opening section
  checked: 2026-11-19

- id: c02-002
  chapter: 02
  claim: Google Search works in three stages (crawling, indexing, serving) and not all pages make it through each stage.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Opening section (three stages)
  checked: 2026-11-19

- id: c02-003
  chapter: 02
  claim: Google does not accept payment to crawl a site more often or rank it higher, and does not guarantee it will crawl, index or serve a page even if it follows Google Search Essentials.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Opening section
  checked: 2026-11-19

- id: c02-004
  chapter: 02
  claim: There is no central registry of web pages; Google discovers URLs from pages it already knows, from links on known pages, and from submitted sitemaps.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Crawling section
  checked: 2026-11-19

- id: c02-005
  chapter: 02
  claim: Googlebot does not crawl every page it discovers.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Crawling section
  checked: 2026-11-19

- id: c02-006
  chapter: 02
  claim: Googlebot uses an algorithmic process to decide which sites to crawl, how often and how many pages to fetch, and slows down in response to signals such as HTTP 500 errors.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Crawling section
  checked: 2026-11-19

- id: c02-007
  chapter: 02
  claim: Common reasons crawling fails include server problems, network issues, robots.txt rules, and pages requiring login.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Crawling section
  checked: 2026-11-19

- id: c02-008
  chapter: 02
  claim: Submitting a sitemap does not guarantee all listed items will be crawled and indexed; sitemaps help most for large sites, new sites with few external links, and sites with much video or image content or in Google News.
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/sitemaps/overview
  locator: Section on whether you need a sitemap
  checked: 2026-11-19

- id: c02-009
  chapter: 02
  claim: Crawl budget is defined as the set of URLs that Google can and wants to crawl, determined by crawl capacity limit and crawl demand.
  label: Official
  source: https://developers.google.com/crawling/docs/crawl-budget
  locator: Definition of crawl budget (capacity limit and demand)
  checked: 2026-11-19

- id: c02-010
  chapter: 02
  claim: Crawl capacity rises when a site responds quickly and reliably and falls when it slows or returns server errors; Google's own crawling resources are finite.
  label: Official
  source: https://developers.google.com/crawling/docs/crawl-budget
  locator: Section on crawl capacity limit
  checked: 2026-11-19

- id: c02-011
  chapter: 02
  claim: "Crawl demand: Google tries to crawl most known URLs, recrawls more popular URLs more often, and recrawls to pick up changes."
  label: Official
  source: https://developers.google.com/crawling/docs/crawl-budget
  locator: Section on crawl demand
  checked: 2026-11-19

- id: c02-012
  chapter: 02
  claim: Every site starts with the same default, conservative crawl capacity limit, and the limit is shared across all Google crawlers.
  label: Official
  source: https://developers.google.com/crawling/docs/crawl-budget
  locator: Section on crawl capacity limit
  checked: 2026-11-19
  note: Page last updated 2026-07-22 when checked.

- id: c02-013
  chapter: 02
  claim: Returning a 304 status tells Google to reuse its cached version.
  label: Official
  source: https://developers.google.com/crawling/docs/crawl-budget
  locator: Section on HTTP 304 responses
  checked: 2026-11-19

- id: c02-014
  chapter: 02
  claim: The crawl budget guide targets sites of roughly 1 million+ pages changing weekly or 10,000+ pages changing daily, and these are not exact thresholds.
  label: Official
  source: https://developers.google.com/crawling/docs/crawl-budget
  locator: Opening section (who the guide is for)
  checked: 2026-11-19

- id: c02-015
  chapter: 02
  claim: Googlebot is the name for two crawler types, Smartphone and Desktop, and most crawl requests use the mobile crawler.
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/googlebot
  locator: Opening section
  checked: 2026-11-19

- id: c02-016
  chapter: 02
  claim: Googlebot crawls the first 2MB of a supported file type and the first 64MB of a PDF, measured uncompressed; after the limit it sends only the downloaded part for indexing consideration.
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/googlebot
  locator: Section on file size limits
  checked: 2026-11-19
  note: Page last updated 2026-02-03 when checked.

- id: c02-017
  chapter: 02
  claim: robots.txt is mainly for avoiding overloading a site and is not a mechanism for keeping a page out of Google; a disallowed page can still be indexed if linked from elsewhere.
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/robots/intro
  locator: Section on what robots.txt is used for
  checked: 2026-11-19

- id: c02-018
  chapter: 02
  claim: Google renders pages and runs JavaScript using a recent version of Chrome; without rendering Google might not see JavaScript-loaded content.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Crawling section
  checked: 2026-11-19

- id: c02-019
  chapter: 02
  claim: "Google processes JavaScript web apps in three phases: crawling, rendering and indexing; Googlebot checks robots.txt first and skips disallowed URLs."
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
  locator: Section on how Googlebot processes JavaScript
  checked: 2026-11-19

- id: c02-020
  chapter: 02
  claim: All pages returning HTTP 200 are sent to the rendering queue; a page may wait a few seconds or longer; rendering may be skipped for non-200 responses.
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
  locator: Section on how Googlebot processes JavaScript
  checked: 2026-11-19

- id: c02-021
  chapter: 02
  claim: Google uses the rendered HTML to index the page, runs JavaScript with an evergreen Chromium, and may skip rendering if it finds noindex in the original HTML.
  label: Official
  source: https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
  locator: Sections on how Googlebot processes JavaScript and on meta robots tags
  checked: 2026-11-19

- id: c02-022
  chapter: 02
  claim: During indexing Google analyses text, key tags and attributes such as title elements and alt attributes, images and videos.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Indexing section
  checked: 2026-11-19

- id: c02-023
  chapter: 02
  claim: Google clusters pages with similar content, selects a canonical that may be shown in results, and treats other pages as alternate versions that may be served in different contexts.
  label: Official
  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Indexing section
  checked: 2026-11-19

- id: c02-024
  chapter: 02
  claim: Google collects signals such as language, the country the content is local to and usability, and may store information in the Google index, a large database hosted on thousands of computers.
