  source: https://developers.google.com/search/docs/fundamentals/how-search-works
  locator: Indexing section
  checked: 2026-11-19

- id: c02-025
  chapter: 02
  claim: Indexing is not guaranteed; reasons include low-quality content, robots meta rules disallowing indexing, and site design that makes indexing difficult.
