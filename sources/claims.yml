- id: c11-003
  chapter: 11
  claim: "The guidelines describe YMYL topics as those that could significantly affect health, financial stability, safety, or the welfare or well-being of society."
  label: Official
  source: https://static.googleusercontent.com/media/guidelines.raterhub.com/en//searchqualityevaluatorguidelines.pdf
  locator: "§2.3, p. 11"
  checked: 2026-11-26

- id: c11-004
  chapter: 11
  claim: "The guidelines name four kinds of YMYL harm: Health or Safety; Financial Security; Government, Civics & Society (including election and voting information); and Other."
  label: Official
  source: https://static.googleusercontent.com/media/guidelines.raterhub.com/en//searchqualityevaluatorguidelines.pdf
  locator: "§2.3, pp. 11-12"
  checked: 2026-11-26

- id: c11-005
  chapter: 11
  claim: "SERoundtable reported the 11 Sep 2025 update changed 'YMYL Society' to 'YMYL Government, Civics & Society', adding election and voting information, and added AI Overview examples."
