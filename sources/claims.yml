  source: https://static.googleusercontent.com/media/guidelines.raterhub.com/en//searchqualityevaluatorguidelines.pdf
  locator: "pp. 11, 19"
  checked: 2026-11-26

- id: c11-009
  chapter: 11
  claim: "Trust is described as the most important member of the E-E-A-T family; informational pages on clear YMYL topics must be accurate to prevent harm."
