- id: c02-038
  chapter: 02
  claim: Nayak testified that retrieval pulls documents matching the query from the index (for every word, the pages it occurs on) by walking postings lists, down to tens of thousands of documents.
  label: Testimony
  source: https://thecapitolforum.com/wp-content/uploads/2023/10/101823-USA-v-Google-PM.pdf
  locator: Trial transcript 18 Oct 2023 PM, 6406-6407
  checked: 2026-11-19
  note: Sworn testimony, answering the Court.

- id: c02-039
  chapter: 02
  claim: Nayak testified that signals narrow tens of thousands of documents to several hundred and that NavBoost is not the only factor; core topicality, PageRank and localization signals also contribute.
  label: Testimony
  source: https://thecapitolforum.com/wp-content/uploads/2023/10/101823-USA-v-Google-PM.pdf
  locator: Trial transcript 18 Oct 2023 PM, 6407:9-6408:2
  checked: 2026-11-19
  note: Sworn testimony.

- id: c02-040
  chapter: 02
  claim: Nayak testified the smaller set goes to a next phase of ranking that uses machine learning among other things.
  label: Testimony
  source: https://thecapitolforum.com/wp-content/uploads/2023/10/101823-USA-v-Google-PM.pdf
  locator: Trial transcript 18 Oct 2023 PM, 6407-6408
  checked: 2026-11-19
  note: Sworn testimony.

