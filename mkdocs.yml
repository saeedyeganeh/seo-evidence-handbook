site_name: SEO Evidence Handbook
site_description: How Google Search works, explained claim by claim with the evidence behind each one.
site_author: Saeed Yeganeh
site_url: https://saeedyeganeh.github.io/seo-evidence-handbook/
repo_url: https://github.com/saeedyeganeh/seo-evidence-handbook
docs_dir: docs
copyright: Text licensed CC BY 4.0 · Saeed Yeganeh · Not affiliated with Google

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - 01 Reading SEO evidence: chapters/01-reading-seo-evidence.md
  - 02 How Search works end to end: chapters/02-how-search-works.md
  - 03 Relevance and search intent: chapters/03-relevance-and-search-intent.md
  - 04 Content quality, originality and effort: chapters/04-content-quality-originality-effort.md
  - 05 Links and how they are weighted: chapters/05-links-and-how-they-are-weighted.md
  - 06 Link spam and patterns: chapters/06-link-spam-and-patterns.md
  - Claim ledger: sources/claims.md
  - Contributing: CONTRIBUTING.md

extra:
  social:
    - icon: material/web
      link: https://saeedyeganeh.com/en/
