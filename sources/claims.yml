- id: c11-006
  chapter: 11
  claim: "The guidelines treat YMYL as a spectrum (clear YMYL, not YMYL, or in between) and ask whether a careful person would seek expert sources or most people would ask friends casually."
  label: Official
  source: https://static.googleusercontent.com/media/guidelines.raterhub.com/en//searchqualityevaluatorguidelines.pdf
  locator: "§2.3, pp. 11-12"
  checked: 2026-11-26

- id: c11-007
  chapter: 11
  claim: "YMYL depends on potential harm rather than industry, so it is not a fixed list of site types."
