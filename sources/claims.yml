  source: https://github.com/saeedyeganeh/seo-evidence-handbook/blob/main/chapters/11-sensitive-ymyl-topics.md
  locator: "Section 11.3"
  checked: 2026-11-26

- id: c11-008
  chapter: 11
  claim: "The guidelines set very high Page Quality standards for clear YMYL pages and say YMYL pages have higher standards than non-YMYL pages."
