# Claim ledger: every factual claim in the handbook, with its evidence.
# Fields: id, chapter, claim, label, source, locator, checked (YYYY-MM-DD), note (optional)

- id: c01-001
  chapter: 01
  claim: Google's ranking systems are designed to work at the page level, and site-wide signals and classifiers are also used.
  label: Official
  source: https://developers.google.com/search/docs/appearance/ranking-systems-guide
  locator: Introductory paragraphs
  checked: 2026-11-18

- id: c01-002
  chapter: 01
  claim: Search quality raters' ratings do not directly influence ranking; they help evaluate ranking systems.
  label: Official
  source: https://developers.google.com/search/blog/2023/11/search-quality-rater-guidelines-update
  locator: Search Central Blog, November 2023 post
  checked: 2026-11-18

- id: c01-003
  chapter: 01
  claim: A DOJ demonstrative quotes Eric Lehman's trial testimony that NavBoost trains on about 13 months of user data.
  label: Testimony
  source: https://www.justice.gov/media/1398886/dl
  locator: Exhibit PXRD016, slide B-2; citing trial testimony 20 Sep 2023 PM, 1805:6-13
  checked: 2026-11-18
  note: Demonstrative exhibit summarising sworn testimony.

- id: c01-004
  chapter: 01
  claim: Notes of a 31 January 2025 call with Pandu Nayak state that NavBoost uses the most recent 13 months of data.
  label: Testimony
  source: https://www.justice.gov/atr/media/1398866/dl
  locator: Exhibit PXR0357, section I
  checked: 2026-11-18
  note: Interview notes by a party's legal team, not sworn testimony.

